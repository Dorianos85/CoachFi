<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coach FI - Demo Day</title>
<style>
:root {
  --bg: #f6f8ec;
  --panel: #ffffff;
  --panel-soft: #fff8e8;
  --ink: #21313f;
  --muted: #667887;
  --line: #dfe7cf;
  --green: #58cc02;
  --green-dark: #46a302;
  --green-soft: #e7f8d8;
  --blue: #1cb0f6;
  --blue-soft: #e2f5ff;
  --yellow: #ffd34d;
  --yellow-soft: #fff2bd;
  --red: #ff6b6b;
  --red-soft: #ffe3e3;
  --purple: #8c7bff;
  --purple-soft: #ebe8ff;
  --shadow: 0 10px 0 rgba(33, 49, 63, 0.08), 0 22px 60px rgba(33, 49, 63, 0.10);
  --radius: 22px;
  --font-size: 16px;
}

body.large { --font-size: 18px; }
body.xlarge { --font-size: 21px; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: "Nunito", "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: var(--font-size);
  background:
    radial-gradient(720px 420px at 10% -10%, rgba(88, 204, 2, 0.20), transparent 60%),
    radial-gradient(680px 420px at 100% 0%, rgba(28, 176, 246, 0.18), transparent 58%),
    var(--bg);
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }

.app {
  max-width: 1180px;
  margin: 0 auto;
  padding: 18px 18px 96px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr) auto;
  gap: 14px;
  align-items: center;
  padding: 12px 0;
  background: linear-gradient(180deg, var(--bg) 72%, rgba(246, 248, 236, 0));
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.logo {
  width: 48px;
  height: 48px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  background: var(--green);
  color: #ffffff;
  font-weight: 1000;
  box-shadow: 0 6px 0 var(--green-dark);
  flex: 0 0 auto;
}

.brand strong { display: block; font-size: 21px; line-height: 1; }
.brand span { display: block; color: var(--muted); font-size: 12px; font-weight: 800; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.language-row, .tool-row, .button-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.language-row { justify-content: center; }
.tool-row { justify-content: flex-end; }

.flag, .chip, .tab, .btn, .nav-btn {
  border: 2px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  border-radius: 16px;
  min-height: 42px;
  padding: 9px 12px;
  font-weight: 950;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 0 rgba(33, 49, 63, 0.08);
}

.flag.active, .tab.active, .nav-btn.active {
  border-color: var(--green);
  background: var(--green-soft);
}

.btn.primary {
  color: #ffffff;
  background: var(--green);
  border-color: var(--green);
  box-shadow: 0 6px 0 var(--green-dark);
}

.btn.blue {
  background: var(--blue-soft);
  border-color: #9adfff;
}

.btn.yellow {
  background: var(--yellow-soft);
  border-color: #f0ca49;
}

.btn.red {
  background: var(--red-soft);
  border-color: #ffb1b1;
}

.btn:active, .flag:active, .tab:active, .nav-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(33, 49, 63, 0.08); }
.btn:focus-visible, .flag:focus-visible, .tab:focus-visible, .nav-btn:focus-visible, input:focus, select:focus, textarea:focus {
  outline: 4px solid rgba(28, 176, 246, 0.26);
  outline-offset: 2px;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
  margin: 8px 0 18px;
}

.tab {
  width: 100%;
  min-width: 0;
  white-space: normal;
  text-align: center;
  line-height: 1.15;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 310px;
  gap: 18px;
  align-items: start;
}

.main, .side { min-width: 0; }
.side {
  position: sticky;
  top: 92px;
  display: grid;
  gap: 14px;
}

.hero, .card, .side-card {
  border: 2px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow);
}

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 230px;
  gap: 22px;
  padding: 28px;
  overflow: hidden;
}

.hero.duo {
  background:
    radial-gradient(340px 240px at 88% 18%, rgba(88, 204, 2, 0.18), transparent 64%),
    linear-gradient(145deg, #ffffff, #f3ffe9);
}

.card, .side-card { padding: 20px; }
.stack { display: grid; gap: 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }

.eyebrow {
  color: var(--green-dark);
  font-size: 12px;
  font-weight: 1000;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

h1, h2, h3 { margin: 0; letter-spacing: -0.025em; }
h1 { font-size: clamp(34px, 5vw, 62px); line-height: 0.97; max-width: 740px; }
h2 { font-size: clamp(24px, 3vw, 36px); line-height: 1.05; }
h3 { font-size: 20px; line-height: 1.15; }
p { line-height: 1.58; }
.muted { color: var(--muted); }
.small { color: var(--muted); font-size: 13px; line-height: 1.45; font-weight: 800; }

.mila {
  border-radius: 28px;
  padding: 18px;
  background: var(--blue-soft);
  border: 2px solid #b8e8ff;
  text-align: center;
}

.mila-face {
  width: 118px;
  height: 118px;
  border-radius: 38px;
  margin: 0 auto 14px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, var(--green), var(--blue));
  color: white;
  font-size: 48px;
  font-weight: 1000;
  box-shadow: 0 10px 0 rgba(33, 49, 63, 0.10);
}

.path {
  display: grid;
  gap: 14px;
}

.path-step {
  display: grid;
  grid-template-columns: 58px minmax(0, 1fr) auto;
  gap: 14px;
  align-items: center;
  border: 2px solid var(--line);
  border-radius: 24px;
  background: var(--panel);
  padding: 14px;
  box-shadow: 0 6px 0 rgba(33, 49, 63, 0.06);
}

.step-dot {
  width: 58px;
  height: 58px;
  border-radius: 19px;
  display: grid;
  place-items: center;
  background: var(--green);
  color: white;
  font-size: 24px;
  font-weight: 1000;
  box-shadow: 0 6px 0 var(--green-dark);
}

.step-dot.locked { background: #c9d3dc; box-shadow: 0 6px 0 #aeb9c4; }

.metric {
  border: 2px solid var(--line);
  border-radius: 20px;
  background: var(--panel-soft);
  padding: 15px;
}
.metric b { display: block; font-size: 28px; line-height: 1; }
.metric span { display: block; color: var(--muted); font-size: 12px; font-weight: 950; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 6px; }

.score-hero {
  display: grid;
  grid-template-columns: minmax(120px, 180px) minmax(0, 1fr);
  gap: 18px;
  align-items: center;
}
.score-ring {
  aspect-ratio: 1;
  border-radius: 999px;
  display: grid;
  place-items: center;
  color: var(--ink);
  background:
    radial-gradient(circle at center, #fff 0 58%, transparent 59%),
    conic-gradient(var(--green) calc(var(--score, 0) * 1%), var(--green-soft) 0);
  border: 2px solid var(--line);
  box-shadow: inset 0 0 0 10px rgba(255,255,255,0.55);
}
.score-ring b { font-size: 38px; }
.gate-card {
  border-color: #c7bfff;
  background: linear-gradient(135deg, #fff, var(--purple-soft));
}
.premium-card {
  border-color: #f0ca49;
  background: linear-gradient(135deg, #fff, var(--yellow-soft));
}

.goal-bar {
  height: 16px;
  border-radius: 999px;
  background: #dce8cc;
  overflow: hidden;
}
.goal-fill {
  height: 100%;
  width: var(--goal, 42%);
  border-radius: inherit;
  background: var(--yellow);
}

.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: grid; gap: 7px; color: var(--muted); font-size: 13px; font-weight: 950; }
.field.full { grid-column: 1 / -1; }
input, select, textarea {
  width: 100%;
  min-height: 48px;
  border: 2px solid var(--line);
  border-radius: 16px;
  background: #ffffff;
  color: var(--ink);
  padding: 10px 12px;
  font-weight: 850;
}
textarea {
  min-height: 152px;
  line-height: 1.48;
  resize: vertical;
}

.answer, .row-card {
  width: 100%;
  border: 2px solid var(--line);
  border-radius: 20px;
  background: #ffffff;
  color: var(--ink);
  padding: 14px;
  text-align: left;
  font-weight: 900;
  display: flex;
  gap: 12px;
  align-items: center;
  box-shadow: 0 4px 0 rgba(33, 49, 63, 0.06);
}
.answer.correct { border-color: var(--green); background: var(--green-soft); }
.answer.wrong { border-color: var(--red); background: var(--red-soft); }

.jar-dot {
  width: 54px;
  height: 54px;
  border-radius: 18px;
  color: #ffffff;
  display: grid;
  place-items: center;
  font-weight: 1000;
  flex: 0 0 auto;
}
.row-body { min-width: 0; flex: 1; }
.row-body p { margin: 5px 0 0; color: var(--muted); font-size: 13px; font-weight: 760; }
.mini-bar {
  height: 9px;
  border-radius: 999px;
  background: #e5edd8;
  overflow: hidden;
  margin-top: 8px;
}
.mini-bar span { display: block; height: 100%; border-radius: inherit; }

.alert {
  border: 2px solid #ffb1b1;
  background: var(--red-soft);
  border-radius: 26px;
  padding: 20px;
}
.phone-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.phone-card {
  border: 2px solid var(--line);
  border-radius: 20px;
  background: #ffffff;
  padding: 15px;
  text-decoration: none;
}
.phone-card b { display: block; font-size: 24px; }
.phone-card span { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 4px; }

.source-list { display: grid; gap: 9px; }
.source-list a {
  border: 2px solid var(--line);
  background: #ffffff;
  border-radius: 16px;
  padding: 11px 12px;
  text-decoration: none;
  font-weight: 950;
  overflow-wrap: anywhere;
}

.portal-grid, .certificate-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.portal-link, .cert-card {
  border: 2px solid var(--line);
  border-radius: 18px;
  background: #ffffff;
  padding: 12px;
  text-decoration: none;
  font-weight: 950;
}

.cert-card.unlocked {
  border-color: var(--green);
  background: var(--green-soft);
}

.cert-card.locked {
  color: var(--muted);
  background: #f6f8f0;
}

.cert-card span, .portal-link span {
  display: block;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
  margin-top: 4px;
}

.shopping-items {
  display: grid;
  gap: 9px;
}

.shopping-item {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  border: 2px solid var(--line);
  border-radius: 16px;
  background: #ffffff;
  padding: 10px 12px;
  font-weight: 900;
}

.shopping-item.done {
  border-color: var(--green);
  background: var(--green-soft);
}

.shopping-item.done span:nth-child(2) {
  text-decoration: line-through;
  color: var(--muted);
}

.receipt-table {
  display: grid;
  gap: 8px;
}

.receipt-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 92px 104px 112px;
  gap: 8px;
  align-items: center;
  border: 2px solid var(--line);
  border-radius: 16px;
  background: #ffffff;
  padding: 10px;
  font-weight: 850;
}

.receipt-row.unplanned {
  border-color: #ffb1b1;
  background: var(--red-soft);
}

.receipt-row.planned {
  border-color: #9de57b;
  background: var(--green-soft);
}

.receipt-preview {
  max-width: 100%;
  max-height: 220px;
  border: 2px solid var(--line);
  border-radius: 18px;
  object-fit: contain;
  background: #ffffff;
}

@media (max-width: 680px) {
  .receipt-row {
    grid-template-columns: 1fr;
  }
}

.mobile-nav {
  display: none;
  position: fixed;
  left: 10px;
  right: 10px;
  bottom: 10px;
  z-index: 30;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  padding: 7px;
  border: 2px solid var(--line);
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: 0 14px 40px rgba(33, 49, 63, 0.16);
}
.nav-btn {
  min-height: 54px;
  padding: 7px 4px;
  font-size: 11px;
  line-height: 1.1;
  box-shadow: none;
  white-space: normal;
  text-align: center;
}

.hidden { display: none !important; }

@media (max-width: 980px) {
  .topbar { grid-template-columns: 1fr; }
  .language-row, .tool-row { justify-content: flex-start; }
  .tabs { display: none; }
  .layout { grid-template-columns: 1fr; }
  .side { position: static; }
  .hero { grid-template-columns: 1fr; }
  .mobile-nav { display: grid; }
}

@media (max-width: 680px) {
  .app { padding: 12px 12px 92px; }
  .hero, .card, .side-card { box-shadow: none; }
  .hero, .card, .side-card { padding: 16px; }
  .grid-2, .grid-3, .grid-4, .field-grid, .phone-grid, .score-hero { grid-template-columns: 1fr; }
  .path-step { grid-template-columns: 48px minmax(0, 1fr); }
  .path-step .btn { grid-column: 1 / -1; width: 100%; }
  .step-dot { width: 48px; height: 48px; border-radius: 16px; }
  h1 { font-size: 38px; }
  .flag { min-height: 38px; padding: 7px 9px; }
}
</style>
</head>

function mergeDeep(base, extra) {
  if (!extra) return structuredClone(base);
  const out = Array.isArray(base) ? [...base] : { ...base };
  for (const [key, value] of Object.entries(extra)) {
    if (value && typeof value === "object" && !Array.isArray(value) && base[key]) out[key] = mergeDeep(base[key], value);
    else out[key] = value;
  }
  return out;
}

function healthScore() {
  const income = Math.max(1, Number(state.healthIncome) || 1);
  const spending = Math.max(0, Number(state.healthSpending) || 0);
  const savings = Math.max(0, Number(state.healthSavings) || 0);
  const investing = Math.max(0, Number(state.healthInvesting) || 0);
  const spendingRatio = spending / income;
  const cushionMonths = savings / Math.max(1, spending);
  const investRate = investing / income;
  let score = 42;
  score += spendingRatio <= 0.6 ? 20 : spendingRatio <= 0.75 ? 12 : spendingRatio <= 0.9 ? 4 : -10;
  score += cushionMonths >= 6 ? 20 : cushionMonths >= 3 ? 14 : cushionMonths >= 1 ? 6 : -10;
  score += investRate >= 0.15 ? 18 : investRate >= 0.1 ? 12 : investRate >= 0.05 ? 7 : -6;
  score += state.healthImpulse <= 2 ? 12 : state.healthImpulse <= 4 ? 4 : -8;
  score += Number(state.healthFamilyPlan) === 2 ? 8 : Number(state.healthFamilyPlan) === 1 ? 4 : -4;
  return Math.max(0, Math.min(100, Math.round(score)));
}

function healthInsights() {
  const copy = funnelCopy().health;

  const spending = Math.max(0, Number(state.healthSpending) || 0);
  const savings = Math.max(0, Number(state.healthSavings) || 0);
  const investing = Math.max(0, Number(state.healthInvesting) || 0);
  const insights = [];
  if (spending / income > 0.75) insights.push(copy.insights.spending);
  if (savings / Math.max(1, spending) < 3) insights.push(copy.insights.savings);
  if (investing / income < 0.1) insights.push(copy.insights.investing);
  if (state.healthImpulse >= 4) insights.push(copy.insights.impulse);
  if (Number(state.healthFamilyPlan) < 2) insights.push(copy.insights.family);
  return insights.slice(0, 3);
}

function decision() {
  const impulse = Math.max(0, Math.min(100, Math.round(
    state.regret * 17 +
    (6 - state.need) * 13 +
    (state.used === 0 ? 14 : state.used <= 1 ? 8 : 0) +
    (state.trigger !== 5 ? 14 : -6) +
    (state.price >= 500 ? 8 : state.price >= 150 ? 4 : 0)
  )));
  const returnOpen = state.days <= state.returnWindow;
  let key = "keep";
  if (returnOpen && state.regret >= 4 && state.need <= 2) key = "return";
  else if (state.need <= 2 && (state.used <= 1 || state.regret >= 3)) key = "sell";
  else if (impulse >= 55) key = "pause";
  return { key, impulse, returnOpen, recoverable: key === "return" ? state.price : Math.round(state.price * 0.6) };
}

function normalizeReceiptValue(value) {
  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^\p{L}\p{N}\s]/gu, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function parseReceiptItems() {
  const ignored = /^(suma|razem|total|subtotal|nip|vat|ptu|paragon|faktura|invoice|data|date|kasjer|podatek|payment|platnosc|płatność)/i;
  return state.receiptText
    .split(/\r?\n/)
    .map((line) => line.trim())
    .filter(Boolean)
    .filter((line) => !ignored.test(line))
    .map((line) => {
      const match = line.match(/(.+?)\s+(-?\d+(?:[,.]\d{1,2})?)(?:\s*(?:zl|zł|pln|eur|€|usd|a|b|c|d))?$/i);
      if (!match) return null;
      const name = match[1].replace(/\s{2,}/g, " ").trim();
      const price = Number(match[2].replace(",", "."));
      if (!name || !Number.isFinite(price) || price <= 0) return null;
      return { name, price };
    })
    .filter(Boolean);
}

  const normalized = normalizeReceiptValue(name);
  const buckets = {
    food: ["mleko", "milk", "ryz", "rice", "chleb", "bread", "warzywa", "vegetable", "owoc", "fruit", "jogurt", "yogurt", "woda", "water", "ser", "cheese", "jajka", "eggs"],
    hygiene: ["pasta", "tooth", "szampon", "shampoo", "mydlo", "soap", "hygiene", "papier", "paper", "zel", "gel"],
    home: ["worki", "bags", "detergent", "plyn", "clean", "battery", "baterie", "dom"],
    pleasure: ["czekolada", "chocolate", "baton", "candy", "slodycze", "sweet", "chips", "cola", "promo", "promocja", "dessert", "ciastka"]
  };
  return Object.keys(buckets).find((key) => buckets[key].some((word) => normalized.includes(word))) || "other";
}

function receiptAnalysis() {
  const items = parseReceiptItems().map((item, index) => {
    const planned = isReceiptPlanned(item.name);
    const category = receiptCategoryKey(item.name);
    const defaultNeeded = planned || ["food", "hygiene", "home"].includes(category);
    const override = state.receiptNeedOverrides[index];
    const needed = typeof override === "boolean" ? override : defaultNeeded;
    return { ...item, planned, category, needed };
  });
  const categoryTotals = { food: 0, hygiene: 0, home: 0, pleasure: 0, other: 0 };
  items.forEach((item) => { categoryTotals[item.category] += item.price; });
  return {
    items,
    total: items.reduce((sum, item) => sum + item.price, 0),
    plannedTotal: items.filter((item) => item.planned).reduce((sum, item) => sum + item.price, 0),
    impulseLeak: items.filter((item) => !item.needed).reduce((sum, item) => sum + item.price, 0),
    categoryTotals
  };
}

function voiceText(kind) {
  const copy = t();
  if (kind === "intro") return funnelCopy().start.voice;
  if (kind === "health") {
    const hc = funnelCopy().health;
    const insights = healthInsights().join(" ");
    return `${hc.resultTitle}: ${healthScore()} out of 100. ${insights} ${hc.planTitle}: ${hc.planSteps.join(" ")}`;
  }
  if (kind === "daily") return copy.daily.questionVoice;
  if (kind === "jars") {
    return `${copy.plan.jarVoice} ${copy.plan.jars.map((jar) => {
      const title = state.jarMode === "kids" ? jar[1] : jar[0];
      return `${title}: ${jar[2]} percent, ${money(state.income * jar[2] / 100)}.`;
    }).join(" ")}`;
  }
  if (kind === "shopping") {
    const d = decision();
    const b = bottleReturn();
    const dec = copy.plan.decisions[d.key];
    return `${state.itemName}. ${dec[0]}. ${dec[1]} ${copy.plan.impulse}: ${d.impulse}. ${copy.plan.recover}: ${money(d.recoverable)}. ${copy.plan.bottlesTitle}: ${b.count}, ${money(b.cash)}.`;
  }
  if (kind === "daily-shopping") return `${shoppingDayCopy().voice} ${state.groceryItems.join(", ")}.`;
  if (kind === "receipt") {
    const copyReceipt = receiptCopy();
    const analysis = receiptAnalysis();
    if (!analysis.items.length) return copyReceipt.empty;
    const items = analysis.items.slice(0, 8).map((item) => `${item.name}: ${money(item.price)}, ${item.planned ? copyReceipt.planned : copyReceipt.unplanned}, ${item.needed ? copyReceipt.needed : copyReceipt.notNeeded}`).join(". ");
    return `${copyReceipt.voice} ${copyReceipt.total}: ${money(analysis.total)}. ${copyReceipt.impulseLeak}: ${money(analysis.impulseLeak)}. ${items}.`;
  }
  if (kind === "crisis") return `${copy.crisis.title}. ${copy.crisis.body} ${copy.crisis.steps.slice(0, 2).join(" ")}`;
  if (kind === "work") return `${copy.work.title}. ${copy.work.body} ${copy.work.steps.slice(0, 4).join(" ")}`;
  if (kind === "kids") return copy.kids.voice;
  if (kind === "side") return copy.side.body;
  return "";
}

function speak(kind) {
  speakRaw(voiceText(kind));
}

function speakRaw(text) {
  if (!("speechSynthesis" in window) || !text) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = langInfo()[3];
  utterance.rate = 0.94;
  window.speechSynthesis.speak(utterance);
}

}

        <div class="field full">
          <div class="eyebrow">${esc(copy.work.messageTitle)}</div>

        </div>
      </article>
      <div class="grid-2">
        <article class="card stack">
          <div class="eyebrow">${esc(copy.work.portalsTitle)}</div>
          <p class="muted">${esc(copy.work.portalsBody)}</p>
          <div class="portal-grid">
            ${JOB_PORTALS.map((portal) => `<a class="portal-link" href="${portal[1]}" target="_blank" rel="noreferrer">${esc(portal[0])}<span>${esc(portal[2])}</span></a>`).join("")}

  const copy = t();

      <section class="stack">

            <input type="checkbox" ${state.kidsConsent ? "checked" : ""} data-field="kidsConsent" style="width:auto;min-height:auto;">
            <span>${esc(copy.kids.consent)}</span>

        <article class="card stack"><div class="eyebrow">${esc(copy.plan.jarTitle)}</div><p class="muted">${esc(copy.plan.jars.map((jar) => `${jar[1]} ${jar[2]}%`).join(", "))}</p><button class="btn blue" type="button" data-speak="kids">${esc(copy.listen)}</button></article>

function renderDocs() {
  const copy = t();
  return `
    <section class="stack">
      <article class="card stack">
        <div class="eyebrow">${esc(copy.docs.eyebrow)}</div>
        <h2>${esc(copy.docs.title)}</h2>
        <p class="muted">${esc(copy.docs.body)}</p>

function renderMain() {
  if (state.screen === "health") return renderHealth();
  if (state.screen === "daily") return renderDaily();
  if (state.screen === "plan") return renderPlan();
  if (state.screen === "crisis") return renderCrisis();
  if (state.screen === "kids") return renderKids();
  if (state.screen === "docs") return renderDocs();
  return renderStart();
}

function renderSide() {
  const copy = t();
  const health = funnelCopy().health;
  const goal = Math.min(100, 42 + Math.floor((state.coins - 125) / 5));
  return `
    <aside class="side">
      <div class="side-card stack">
        <div class="grid-2">
          <div class="metric"><b>${state.healthUnlocked ? healthScore() : state.score}</b><span>${esc(copy.score)}</span></div>
          <div class="metric"><b>${state.coins}</b><span>${esc(copy.coins)}</span></div>
        </div>
        <div>
          <div class="small">${esc(copy.progress)}</div>
          <div class="goal-bar" style="--goal:${goal}%"><div class="goal-fill"></div></div>
        </div>
      </div>
      <div class="side-card stack">
        <div class="eyebrow">${esc(copy.checklist.nftTitle)}</div>

            <div class="cert-card ${unlocked ? "unlocked" : "locked"}">

      <div class="side-card stack">
        <div class="eyebrow">${esc(copy.side.sources)}</div>
        <div class="source-list">
          <a href="https://116sos.pl/otrzymaj-pomoc/telefon" target="_blank" rel="noreferrer">116sos.pl</a>

function render() {
  const copy = t();
  document.documentElement.lang = langInfo()[3].split("-")[0];
  document.title = `Coach FI - ${copy.name}`;
  document.body.classList.toggle("large", state.textSize === "large");
  document.body.classList.toggle("xlarge", state.textSize === "xlarge");
  root.innerHTML = `
    <div class="app">
      ${renderTop()}
      <div class="layout">
        <main class="main">${renderMain()}</main>
        ${renderSide()}
      </div>
    </div>
    <nav class="mobile-nav" aria-label="Coach FI">${renderTabs(true)}</nav>
  `;
}

root.addEventListener("click", async (event) => {
  const target = event.target.closest("button, a");
  if (!target) return;
  if (target.dataset.locale) {
    state.locale = target.dataset.locale;
    state.answered = null;
    render();
    return;
  }
  if (target.dataset.textSize) {
    state.textSize = target.dataset.textSize;
    render();
    return;
  }
  if (target.dataset.screen) {
    state.screen = target.dataset.screen;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  if (target.dataset.speak) {
    speak(target.dataset.speak);
    return;
  }
  if (target.dataset.action === "analyze-health") {
    state.healthAnalyzed = true;
    completeAction("health-analyzed", 15);
    render();
    return;
  }
  if (target.dataset.action === "unlock-health") {
    if (state.healthEmail.includes("@") && state.healthAccepted) {
      state.healthUnlocked = true;
      completeAction("health-unlocked", 25);
      speak("health");
    }
    render();
    return;
  }
  if (target.dataset.action === "start-trial") {
    state.premiumTrial = true;
    completeAction("premium-trial", 20);
    render();
    return;
  }
  if (target.dataset.answer) {
    state.answered = Number(target.dataset.answer);
    if (state.answered === 1) {
      completeAction("daily-answer", 25);
      speakRaw(t().daily.correct);
    } else {
      speakRaw(t().daily.wrong);
    }
    render();
    return;
  }
  if (target.dataset.complete) {
    completeAction(target.dataset.complete, Number(target.dataset.token) || 10);
    render();
    return;
  }
  if (target.dataset.crisisStep) {
    const index = Number(target.dataset.crisisStep);
    if (!state.completedSteps.has(index)) {
      state.completedSteps.add(index);
      state.coins += 15;
    }
    render();
    return;
  }
  if (target.dataset.action === "add-unused") {
    if (state.unusedValue > 0) state.unusedTotal += state.unusedValue;
    completeAction("plan-unused", 10);
    render();
    return;
  }
  if (target.dataset.action === "add-grocery") {
    const item = state.groceryInput.trim();
    if (item) {
      state.groceryItems.push(item);
      state.groceryInput = "";
      completeAction("plan-daily-shopping", 15);
    }
    render();
    return;
  }
  if (target.dataset.grocery) {
    const index = Number(target.dataset.grocery);
    if (!state.groceryDone.has(index)) {
      state.groceryDone.add(index);
      completeAction(`grocery-${index}`, 5);
    }
    render();
    return;
  }
  if (target.dataset.action === "avoid-impulse") {
    state.avoidedImpulse = true;
    completeAction("grocery-avoid-impulse", 15);
    render();
    return;
  }
  if (target.dataset.action === "analyze-receipt") {
    completeAction("receipt-analyze", 20);
    completeAction("plan-receipt", 20);
    render();
    return;
  }
  if (target.dataset.receiptNeed !== undefined) {
    const index = Number(target.dataset.receiptNeed);
    const item = receiptAnalysis().items[index];
    if (item) {
      state.receiptNeedOverrides[index] = !item.needed;
      completeAction(`receipt-need-${index}`, 5);
    }
    render();
    return;
  }
  if (target.dataset.action === "copy-template") {
    const text = t().crisis.templateText[state.template];
    try { await navigator.clipboard.writeText(text); target.textContent = t().copied; }
    catch { document.getElementById("templateBox").select(); document.execCommand("copy"); }
    return;
  }
  if (target.dataset.action === "copy-job-message") {
    const text = jobMessage();
    try { await navigator.clipboard.writeText(text); target.textContent = t().copied; }
    catch { target.previousElementSibling.select(); document.execCommand("copy"); }
    completeAction("work-2", 10);
    render();
    return;
  }
  if (target.dataset.action === "enter-kids") {
    if (state.kidsConsent) state.kidsEntered = true;
    render();
    return;
  }
  if (target.dataset.action === "kids-stars") {
    state.kidsStars += 5;
    completeAction("kids-stars", 5);
    render();
    speak("kids");
  }
});

root.addEventListener("change", (event) => {
  const target = event.target;
  if (target.dataset.file === "receipt") {
    const file = target.files && target.files[0];
    state.receiptFileName = file ? file.name : "";
    state.receiptImageData = "";
    if (file && file.type.startsWith("image/")) {
      const reader = new FileReader();
      reader.onload = () => {
        state.receiptImageData = String(reader.result || "");
        render();
      };
      reader.readAsDataURL(file);
    } else {
      render();
    }
    return;
  }
  const field = target.dataset.field;
  if (!field) return;
  if (field === "kidsConsent" || field === "healthAccepted" || field === "marketingConsent") state[field] = target.checked;
  else if (["itemName", "unusedName", "city", "jarMode", "cvText", "strengths", "valueOffer", "groceryInput", "impulseItem", "receiptText", "healthEmail"].includes(field)) state[field] = target.value;
  else if (field === "template" || field === "trigger" || field === "healthFamilyPlan") state[field] = Number(target.value);
  else state[field] = Number(target.value);
  render();
});

root.addEventListener("input", (event) => {
  const target = event.target;
  const field = target.dataset.field;
  if (!field || target.tagName === "SELECT" || target.type === "checkbox") return;
  if (["itemName", "unusedName", "city", "cvText", "strengths", "valueOffer", "groceryInput", "impulseItem", "receiptText", "healthEmail"].includes(field)) state[field] = target.value;
  else state[field] = Number(target.value);
});

render();
</script>
